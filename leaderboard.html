<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>牛来运转 · 用户榜</title>
<script src="vendor/qrcode.min.js"></script>
<style>
  :root{
    --gold:#ffd23f; --red:#e23b3b; --bg:#0f1115; --card:#171a21; --line:rgba(255,255,255,.08);
    --dim:#9aa3b2; --main:#f4f6fb; --green:#51d88a; --blue:#5a9bff; --orange:#ff8a3d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:radial-gradient(1200px 600px at 50% -10%,#1b2030,#0f1115);
    color:var(--main);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:18px 14px 80px}

  h1{margin:0 0 4px;font-size:22px;display:flex;align-items:center;gap:8px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:14px}
  .sub a{color:var(--gold);text-decoration:none}

  .pk-banner{display:none;background:linear-gradient(135deg,rgba(255,138,61,.18),rgba(255,45,45,.16));
    border:1px solid rgba(255,138,61,.4);border-radius:14px;padding:14px;margin-bottom:14px}
  .pk-banner.show{display:block}
  .pk-banner .pk-title{font-size:14px;color:var(--orange);font-weight:700;margin-bottom:6px}
  .pk-banner .pk-vs{display:flex;justify-content:space-between;gap:8px}
  .pk-banner .pk-side{flex:1;background:rgba(0,0,0,.25);padding:10px;border-radius:10px;text-align:center}
  .pk-banner .pk-side .who{color:var(--dim);font-size:12px}
  .pk-banner .pk-side .sc{font-size:22px;font-weight:800;color:var(--gold);margin-top:4px}
  .pk-banner .pk-side .sc.lose{color:var(--green)}
  .pk-banner .pk-side .sc.win{color:var(--red)}
  .pk-banner .pk-cta{margin-top:10px;display:flex;gap:8px}
  .pk-banner .pk-cta a,.pk-banner .pk-cta button{flex:1;text-align:center;text-decoration:none;padding:8px;border-radius:9px;font-weight:700;font-size:13px;border:none;cursor:pointer}
  .btn-gold{background:linear-gradient(135deg,#ffd23f,#ffb300);color:#1a1300}
  .btn-ghost{background:rgba(255,255,255,.06);color:var(--dim);border:1px solid var(--line)}
  .btn-red{background:linear-gradient(135deg,#e23b3b,#b71c1c);color:#fff}

  /* 领奖台 TOP3 */
  .podium{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px;margin:14px 0 18px;align-items:end}
  .pod-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center}
  .pod-card.gold{order:2;background:linear-gradient(160deg,rgba(255,210,63,.18),rgba(255,210,63,.06));border-color:rgba(255,210,63,.45)}
  .pod-card.silver{order:1}
  .pod-card.bronze{order:3}
  .pod-card .ph{font-size:38px}
  .pod-card .pn{font-weight:700;font-size:14px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pod-card .ps{color:var(--gold);font-weight:800;font-size:18px;margin-top:4px}
  .pod-card .pr{color:var(--dim);font-size:11px;margin-top:2px}

  /* 完整列表 */
  table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  th,td{padding:10px 12px;text-align:left;font-size:14px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:600;background:rgba(255,255,255,.03);font-size:12.5px}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:rgba(255,210,63,.04)}
  .rank{font-weight:800;color:var(--gold);width:42px}
  .score{color:#ff6b6b;font-weight:700;text-align:right;white-space:nowrap}
  .empty{padding:28px;text-align:center;color:var(--dim)}
  tbody tr.me{background:linear-gradient(90deg,rgba(255,210,63,.16),rgba(255,210,63,.05));box-shadow:inset 3px 0 0 var(--gold)}
  .me-tag{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:999px;background:var(--gold);color:#1a1300;font-size:11px;font-weight:800;vertical-align:middle}

  /* 分享区 */
  .share{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .share h3{margin:0 0 8px;font-size:15px;color:var(--gold-soft,#ffd23f)}
  .share .row{display:flex;gap:8px;flex-wrap:wrap}
  .share .row > *{flex:1;min-width:0}
  .share button{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--main);font-size:14px;cursor:pointer;font-weight:600}
  .share button.primary{background:linear-gradient(135deg,#ffd23f,#ffb300);color:#1a1300;border-color:transparent}

  /* PK 邀请 */
  .pk-create{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .pk-create h3{margin:0 0 8px;font-size:15px;color:var(--orange)}
  .pk-create .pkinfo{font-size:13px;color:var(--dim);margin:8px 0}
  .pk-create .pkcode{font-size:38px;font-weight:900;letter-spacing:8px;color:var(--gold);text-align:center;padding:14px;background:rgba(0,0,0,.25);border-radius:10px;margin:8px 0;font-family:"SF Mono","Menlo","Consolas",monospace}
  .pk-create .pklink{word-break:break-all;background:rgba(0,0,0,.25);padding:10px;border-radius:8px;font-size:12px;color:var(--dim);margin-bottom:10px}

  /* 弹窗 */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;padding:14px;z-index:60}
  .overlay.show{display:flex}
  .modal{width:100%;max-width:420px;max-height:92vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .modal h3{margin:0 0 12px;font-size:18px;color:var(--gold)}
  .qrarea{display:flex;flex-direction:column;align-items:center;gap:10px}
  #qrCanvas{background:#fff;border-radius:10px;padding:10px}
  .qrcap{font-size:13px;color:var(--dim);text-align:center}
  .btnrow{display:flex;gap:8px;margin-top:14px}
  .btnrow button{flex:1;padding:10px;border-radius:9px;border:none;font-weight:700;font-size:14px;cursor:pointer}
  .canvas-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(0,0,0,.2);padding:10px;border-radius:10px}
  .canvas-wrap canvas{max-width:100%;height:auto}
  .format-toggle{display:flex;gap:4px;background:rgba(0,0,0,.3);border-radius:8px;padding:3px}
  .format-toggle button{padding:6px 12px;border-radius:6px;border:none;background:transparent;color:var(--dim);cursor:pointer;font-size:13px;font-weight:600}
  .format-toggle button.active{background:var(--gold);color:#1a1300}

  /* 工具栏 */
  .pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .pager button{background:rgba(255,255,255,.06);color:var(--main);border:1px solid var(--line);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px}
  .pager .cur{background:var(--gold);color:#1a1300;border-color:var(--gold);font-weight:700}
  .filter{display:flex;gap:8px;margin:10px 0}
  .filter input,.filter select{padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--main);font-size:13.5px}
  .filter input[type=search]{flex:1}

  .home-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px}
  .home-nav a{color:var(--gold);text-decoration:none}
  .stat{color:var(--dim);font-size:12.5px;margin-top:8px}

  .foot{text-align:center;color:var(--dim);font-size:12px;margin-top:30px}
  .foot a{color:var(--gold);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">

  <div class="home-nav">
    <a href="index.php">← 返回首页</a>
    <a href="niulai-game.html">🐂 玩游戏</a>
  </div>

  <h1>🏆 牛人榜</h1>
  <div class="sub">本机 + 服务端（Redis）排行榜 · 纯前端页面 · 数据来源 <code>api/rank.php</code></div>

  <!-- PK 横幅（URL 携带 ?pk=CODE 时显示） -->
  <div class="pk-banner" id="pkBanner">
    <div class="pk-title">⚔️ 有人向你发出 PK 挑战</div>
    <div class="pk-vs">
      <div class="pk-side"><div class="who" id="pkChallengerName">对手昵称</div><div class="sc" id="pkChallengerScore">0</div><div style="color:var(--dim);font-size:11px">发起方</div></div>
      <div class="pk-side"><div class="who" id="pkRecipientName">你</div><div class="sc" id="pkRecipientScore">—</div><div style="color:var(--dim);font-size:11px">挑战方</div></div>
    </div>
    <div class="pk-cta">
      <a class="btn-gold" id="pkGoGame">▶ 去游戏挑战</a>
      <button class="btn-ghost" onclick="document.getElementById('pkBanner').classList.remove('show')">稍后</button>
    </div>
  </div>

  <!-- 领奖台 TOP3 -->
  <div class="podium" id="podium"></div>

  <!-- 列表区 -->
  <div class="filter">
    <input type="search" id="q" placeholder="搜索昵称…" oninput="onSearch()">
    <select id="per">
      <option value="20">20/页</option>
      <option value="50">50/页</option>
      <option value="100">100/页</option>
    </select>
  </div>
  <table>
    <thead><tr><th class="rank">#</th><th>昵称</th><th>分数</th><th>原因</th><th>日期</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="pager" id="pager"></div>
  <div class="stat" id="stat"></div>

  <!-- 分享区 -->
  <div class="share">
    <h3>📤 把榜单分享给好友</h3>
    <div class="row">
      <button onclick="doShare('system')">系统分享</button>
      <button onclick="openQR()">二维码</button>
      <button onclick="openPoster()">生成海报</button>
      <button class="primary" onclick="doShare('copy')">复制链接</button>
    </div>
  </div>

  <!-- PK 邀请区 -->
  <div class="pk-create">
    <h3>⚔️ 生成 PK 邀请码</h3>
    <div style="color:var(--dim);font-size:13px">对方扫码/点链接后，可对比你们本局成绩</div>
    <div class="pkinfo" id="pkCreateInfo">没有本局数据？请先玩一局，再来这里生成。</div>
    <button class="btn-gold" style="padding:10px 14px;border-radius:9px;border:none;cursor:pointer;font-weight:700" onclick="createPK()">⚔️ 生成 PK 邀请码</button>
    <div id="pkCreateResult" style="display:none">
      <div class="pkcode" id="pkCode">------</div>
      <div class="pklink" id="pkLink"></div>
      <div class="row">
        <button class="btn-ghost" onclick="openPKQR()">显示对方扫码图</button>
        <button class="btn-red" onclick="copyPK()">复制邀请链接</button>
      </div>
    </div>
  </div>

  <div class="foot">🐂 牛来运转 · 由 Redis + SQLite 共同撑起榜单 / 分享 / 好友 PK</div>
</div>

<!-- ===== 弹窗：二维码 ===== -->
<div class="overlay" id="qrOv">
  <div class="modal">
    <h3>📱 扫码看榜单</h3>
    <div class="qrarea">
      <div id="qrCanvas"></div>
      <div class="qrcap" id="qrCap">本页链接（含 PK 时附带邀请）</div>
    </div>
    <div class="btnrow">
      <button class="btn-ghost" onclick="closeQR()">关闭</button>
      <button class="btn-gold" onclick="copyLink()">复制链接</button>
    </div>
  </div>
</div>

<!-- ===== 弹窗：海报 ===== -->
<div class="overlay" id="posterOv">
  <div class="modal">
    <h3>🖼️ 海报分享</h3>
    <div class="format-toggle" id="formatToggle" style="align-self:center">
      <button data-f="landscape" class="active">🖥 横版</button>
      <button data-f="portrait">📱 竖版</button>
    </div>
    <div class="canvas-wrap"><canvas id="poster"></canvas></div>
    <div class="btnrow">
      <button class="btn-ghost" onclick="closePoster()">关闭</button>
      <button class="btn-gold" onclick="downloadPoster()">下载 PNG</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
 *  工具
 * ============================================================ */
const $ = id => document.getElementById(id);
function cut2(x){ return (Math.floor(x*100)/100).toFixed(2).replace(/\.?0+$/,''); }
function fmt(n){
  n = Math.floor(Number(n)||0);
  const neg = n < 0; n = Math.abs(n);
  let s;
  if (n >= 1e16) s = cut2(n/1e16) + '京';
  else if (n >= 1e12) s = cut2(n/1e12) + '万亿';
  else if (n >= 1e8) s = cut2(n/1e8) + '亿';
  else if (n >= 1e4) s = cut2(n/1e4) + '万';
  else s = String(n);
  return neg ? '-'+s : s;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(msg){
  let t = document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';
    Object.assign(t.style,{position:'fixed',left:'50%',bottom:'28px',transform:'translateX(-50%)',
      background:'#222',color:'#fff',padding:'10px 18px',borderRadius:'10px',
      fontSize:'14px',zIndex:'99',border:'1px solid rgba(255,255,255,.1)'});document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';
  clearTimeout(t._t);t._t=setTimeout(()=>{t.style.opacity='0';},1800);
}

let page=1, per=20, q='';

/* ============================================================
 *  拉榜单
 * ============================================================ */
async function load(){
  const u = `api/rank.php?page=${page}&per=${per}&q=${encodeURIComponent(q)}`
           + (pkg.lastRunId ? `&info=1&id=${encodeURIComponent(pkg.lastRunId)}` : '');
  const j = await (await fetch(u)).json();
  if(!j.ok){toast('加载失败：'+(j.error||''));return;}

  // 领奖台 TOP3（如果当前页是第 1 且未搜索）
  const podium = $('podium');
  if (page===1 && q==='' && j.list && j.list.length>=1){
    const top3 = j.list.slice(0,3);
    const order = [top3[1], top3[0], top3[2]].filter(Boolean);
    podium.style.display = '';
    podium.innerHTML = order.map((e,i)=>{
      const cls = ['silver','gold','bronze'][i];
      const emoji = ['🥈','🥇','🥉'][i];
      return `<div class="pod-card ${cls}">
        <div class="ph">${emoji}</div>
        <div class="pn">${esc(e.name)}</div>
        <div class="ps">${fmt(e.score)}</div>
        <div class="pr">${esc(e.reason||'')}</div>
      </div>`;
    }).join('');
  } else {
    podium.style.display = 'none'; podium.innerHTML = '';
  }

  // 列表
  const tb = $('tbody');
  if(!j.list.length){
    tb.innerHTML = '<tr><td colspan="5" class="empty">暂无数据 · 去跑一局再回来</td></tr>';
  } else {
    tb.innerHTML = j.list.map((e,i)=>{
      const r=(j.page-1)*j.per+i+1;
      const isMe = pkg.lastRunId && e.id === pkg.lastRunId;
      return `<tr class="${isMe?'me':''}">
        <td class="rank">${r}</td>
        <td>${esc(e.name)}${isMe?' <span class="me-tag">我</span>':''}</td>
        <td class="score">${fmt(e.score)}</td>
        <td>${esc(e.reason||'—')}</td>
        <td>${esc(e.date||'—')}</td>
      </tr>`;
    }).join('');
  }
  // 分页
  const p=$('pager');
  if(j.pages<=1){p.innerHTML='';}
  else {
    let h='';
    h+=`<button ${j.page<=1?'disabled':''} onclick="go(${j.page-1})">‹ 上一页</button>`;
    const s=Math.max(1,j.page-2), e=Math.min(j.pages,j.page+2);
    for(let i=s;i<=e;i++) h+=`<button class="${i===j.page?'cur':''}" onclick="go(${i})">${i}</button>`;
    h+=`<button ${j.page>=j.pages?'disabled':''} onclick="go(${j.page+1})">下一页 ›</button>`;
    p.innerHTML=h;
  }
  let stat = `共 ${j.total} 条 · 第 ${j.page}/${j.pages} 页`;
  if (j.mine) stat += ` · 你的成绩 ${fmt(j.mine.score)} 分`;
  $('stat').textContent = stat;

  // 若有本人条目，记录供分享海报/PK
  pkg.topList = j.list || [];
  pkg.mine = j.mine || null;
}
function go(p){ page = Math.max(1,p); load(); }
$('per').addEventListener('change', e => { per=+e.target.value; page=1; load(); });
function onSearch(){ q=$('q').value.trim(); page=1; load(); }

window.addEventListener('popstate', ()=>{ loadPKFromURL(); });
window.addEventListener('load', async () => { await loadMyBest(); load(); loadPKFromURL(); });

/* ============================================================
 *  PK 横幅（URL 携带 ?pk=）
 * ============================================================ */
function loadPKFromURL(){
  const u = new URL(location.href);
  const code = u.searchParams.get('pk');
  if(!code) return;
  loadMyBest();   // 同步读 localStorage，pkg.lastScore / pkg.myName 立即可用
  fetch('api/pk.php?api=1&action=resolve&code='+encodeURIComponent(code))
    .then(r=>r.json()).then(j=>{
      if(!j.ok){return;}
      const c = j.pk.challenger;
      $('pkBanner').classList.add('show');
      $('pkChallengerName').textContent = c.name + ' 挑战你';
      const cs = $('pkChallengerScore'), rs = $('pkRecipientScore');
      cs.textContent = fmt(c.score); cs.className = 'sc'; rs.className = 'sc';
      // 收方（你）的本地最好成绩，做赢/输对比
      const myScore = pkg.lastScore || 0;
      $('pkRecipientName').textContent = pkg.myName || '你';
      if (myScore > 0){
        rs.textContent = fmt(myScore);
        if (myScore >= c.score){ rs.classList.add('win'); cs.classList.add('lose'); }
        else { rs.classList.add('lose'); cs.classList.add('win'); }
      } else { rs.textContent = '先玩一局'; }
      // 携带 runId 提示去 niulai-game.html
      $('pkGoGame').href = 'niulai-game.html?challenger='+encodeURIComponent(c.runId)+'&cname='+encodeURIComponent(c.name)+'&cscore='+encodeURIComponent(c.score)+'&pk='+encodeURIComponent(code);
    });
}

/* ============================================================
 *  分享（含记录 share_records）
 * ============================================================ */
const pkg = { shareUrl: location.href, topList: [], rank: null, mine: null, lastRunId: null, lastScore: 0, myName: '', qrUrl: null };

async function loadMyBest(){
  // 从 localStorage 拿最近一次 runId / 最高净值 / 昵称，分享/PK/我的成绩 用
  try {
    const raw = localStorage.getItem('niulai_save_bak') || localStorage.getItem('niulai_save');
    if(raw){
      const s = JSON.parse(raw);
      pkg.lastRunId = s.runId || s._runId || s.id || null;
      pkg.lastScore = (typeof s.maxNetWorth === 'number' && s.maxNetWorth > 0) ? s.maxNetWorth
                      : (s.score || s._topScore || s.peakNet || 0);
      pkg.myName = (s.nickname && String(s.nickname).trim()) || '';
    }
  } catch(_){}
  return pkg;
}

async function logShare(channel, extra){
  const my = await loadMyBest();
  if(!my.lastRunId){ return; }
  fetch('api/share.php', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({ run_id: my.lastRunId, score: my.lastScore||0, channel }, extra||{}))
  }).catch(()=>{});
}

async function doShare(channel){
  if(channel==='copy'){
    try{ await navigator.clipboard.writeText(pkg.shareUrl); toast('链接已复制'); }
    catch(_){ toast('复制失败'); }
    logShare('copy'); return;
  }
  if(channel==='system'){
    if(navigator.share){
      try{
        await navigator.share({ title:'牛来运转 · 牛人榜', text:'来，看我的牛人榜 🐂', url: pkg.shareUrl });
        logShare('system'); return;
      }catch(_){ /* fallthrough */ }
    }
    // 不支持 system：退化为复制链接
    doShare('copy'); return;
  }
}

/* ----- 二维码 ----- */
function openQR(text){
  const url = text || pkg.shareUrl || location.href;
  pkg.qrUrl = url;
  $('qrOv').classList.add('show');
  $('qrCap').textContent = text ? '对方扫码进入 PK 挑战' : '本页链接（含 PK 时附带邀请码）';
  $('qrCanvas').innerHTML = '';
  new QRCode($('qrCanvas'), { text: url, width: 200, height: 200, colorDark: '#222', colorLight: '#fff', correctLevel: QRCode.CorrectLevel.M });
  if (!text) logShare('qrcode');
}
async function copyLink(url){
  url = url || pkg.qrUrl || pkg.shareUrl || location.href;
  try{ await navigator.clipboard.writeText(url); toast('链接已复制'); }
  catch(_){ toast('复制失败'); }
}
function closeQR(){ $('qrOv').classList.remove('show'); }

/* ----- 海报 (canvas) ----- */
let posterFmt = window.innerWidth >= 720 ? 'landscape' : 'portrait';
document.querySelectorAll('#formatToggle button').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('#formatToggle button').forEach(x=>x.classList.toggle('active',x===b));
    posterFmt = b.dataset.f;
    renderPoster();
  });
});

}
function closePoster(){ $('posterOv').classList.remove('show'); }

async function renderPoster(){
  // 默认取榜首 + 当前用户的最好成绩
  const cv = $('poster'); const ctx = cv.getContext('2d');
  const W = posterFmt==='landscape'? 900 : 540;
  const H = posterFmt==='landscape'? 540 : 900;
  cv.width = W; cv.height = H;

  // 背景渐变
  const g = ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#1b2030'); g.addColorStop(1,'#0f1115');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // 装饰光
  ctx.globalAlpha = 0.10;
  for(let i=0;i<6;i++){
    const r = (Math.sin(i)+1.5)*100;
    ctx.beginPath(); ctx.fillStyle = ['#ffd23f','#e23b3b','#5a9bff'][i%3];
    ctx.arc((i*173)%W, (i*131)%H, r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 顶部标题
  ctx.fillStyle = '#ffd23f'; ctx.font = 'bold 44px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center'; ctx.fillText('🐂 牛来运转 · 牛人榜', W/2, 70);

  // 第 1 名卡
  const top = pkg.topList[0] || { name:'—', score:0, reason:'—', date:'' };
  ctx.fillStyle = '#171a21';
  ctx.fillRect(40, 110, W-80, posterFmt==='landscape'? 280 : 360);
  ctx.strokeStyle = 'rgba(255,210,63,0.45)'; ctx.lineWidth=2; ctx.strokeRect(40,110,W-80, posterFmt==='landscape'?280:360);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 38px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(`🥇 ${top.name}`, W/2, 170);
  ctx.fillStyle = '#ffd23f'; ctx.font = 'bold 64px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(fmt(top.score), W/2, 250);
  ctx.fillStyle = '#9aa3b2'; ctx.font = '20px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(`${top.reason||''} · ${top.date||''}`, W/2, 290);

  // 第 2-5 名（紧凑列出）
  const startY = posterFmt==='landscape'? 410 : 490;
  pkg.topList.slice(1,5).forEach((e,i)=>{
    const y = startY + i*32;
    ctx.fillStyle = '#f4f6fb'; ctx.font = '20px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'left';   ctx.fillText(`${i+2}. ${e.name}`, 60, y);
    ctx.textAlign = 'right';  ctx.fillStyle='#ff6b6b'; ctx.fillText(fmt(e.score), W-60, y);
  });

  // 底部 footer（海报宽竖位置不同）
  ctx.fillStyle = '#9aa3b2'; ctx.font = '16px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='center';
  ctx.fillText(`扫码进入榜单 / 与好友 PK   ${location.host}`, W/2, H-44);
  ctx.fillStyle = 'rgba(255,210,63,0.85)';
  ctx.fillText('小程序 / 网页版：搜索「牛来运转」', W/2, H-22);

  // 我的成绩（有本地存档时）
  if (pkg.lastScore > 0){
    ctx.fillStyle = '#5a9bff';
    ctx.font = 'bold 18px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(`我的最好成绩：${fmt(pkg.lastScore)} 🪙`, W/2, H-66);
  }

  // 叠加右下角 QR
  await drawCornerQR(ctx, W, H);
}

function drawCornerQR(ctx, W, H){
  return new Promise((resolve)=>{
    // 用临时 DOM 生成 QR，再画到 canvas
    const div = document.createElement('div');
    div.style.position='absolute'; div.style.left='-9999px';
    document.body.appendChild(div);
    new QRCode(div, { text: pkg.shareUrl, width: 110, height: 110, colorDark:'#222', colorLight:'#fff', correctLevel:QRCode.CorrectLevel.L });
    setTimeout(()=>{
      const img = div.querySelector('img') || div.querySelector('canvas');
      const sz = posterFmt==='landscape'? 130 : 150;
      try{
        // 白底
        ctx.fillStyle='#fff'; ctx.fillRect(W-sz-30, H-sz-60, sz, sz);
        if (img.tagName==='IMG') ctx.drawImage(img, W-sz-20, H-sz-50, sz-20, sz-20);
        else ctx.drawImage(img, W-sz-20, H-sz-50, sz-20, sz-20);
      }catch(_){}
      document.body.removeChild(div);
      resolve();
    }, 120);
  });
}

/* ============================================================
 *  PK 邀请生成
 * ============================================================ */
async function createPK(){
  const my = await loadMyBest();
  if(!my.lastRunId){ toast('没找到本局数据，先去玩一局'); return; }
  if(!my.lastScore || my.lastScore <= 0){ toast('本局成绩为 0，先去玩一局再 PK'); return; }
  const r = await fetch('api/pk.php?api=1&action=create', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ run_id: my.lastRunId, name: pkg.myName || '牛人', score: my.lastScore, challenge:'来 PK 一局！' })
  });
  const j = await r.json();
  if(!j.ok){ toast('生成失败：'+(j.error||'')); return; }
  $('pkCreateInfo').textContent = `用你的成绩 ${fmt(my.lastScore)} 🪙 发起 PK · 把短码告诉好友，或发下面的链接 / 二维码`;
  $('pkCreateResult').style.display = '';
  $('pkCode').textContent = j.code;
  $('pkLink').textContent = j.url;
  pkg.pkInviteUrl = j.url; pkg.pkInviteCode = j.code;
  logShare('other');
}

function copyPK(){
  if(!pkg.pkInviteUrl){ toast('先生成邀请'); return; }
  const url = pkg.pkInviteUrl;
  navigator.clipboard.writeText(url).then(()=>toast('邀请链接已复制'), ()=>toast('复制失败'));
}

function openPKQR(){
  if(!pkg.pkInviteUrl){ toast('先生成邀请'); return; }
  openQR(pkg.pkInviteUrl);   // 不改 pkg.shareUrl，避免污染普通二维码
}
